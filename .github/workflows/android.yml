name: Build Android APK (arm64-v8a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Убираем привязку к предустановленному NDK 27+, если проект не требует конкретный старый NDK
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_LATEST_HOME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare SDK & NDK compatibility
        run: |
          # Удаляем путь к несовместимому NDK 27.x из local.properties, если он туда подставляется
          if [ -f local.properties ]; then
            sed -i '/^ndk\.dir=/d' local.properties
          fi
          # При необходимости можно установить старый NDK (например, 21.4.7075529) через sdkmanager:
          # yes | sdkmanager --licenses >/dev/null
          # sdkmanager "ndk;21.4.7075529"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK for arm64-v8a
        run: ./gradlew assembleDebug -Pandroid.injected.abi=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
